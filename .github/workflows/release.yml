name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path("SKILL.md").read_text(encoding="utf-8")
          match = re.search(r"Versione: \*\*(\d+\.\d+\.\d+)", text)
          if not match or f"v{match.group(1)}" != os.environ["RELEASE_TAG"]:
              raise SystemExit("Il tag non coincide con la versione della skill")
          PY
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build package
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/quote-card-builder.zip HEAD SKILL.md README.md PRODUCT.md DESIGN.md agents assets references scripts tests
          unzip -t dist/quote-card-builder.zip
          cd dist
          sha256sum quote-card-builder.zip > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/quote-card-builder.zip dist/SHA256SUMS.txt --title "Quote Card Builder ${GITHUB_REF_NAME}" --generate-notes
