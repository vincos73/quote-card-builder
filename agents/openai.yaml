interface:
  display_name: "Quote Card Builder"
  short_description: "Source-aware, brand-ready quote cards"
  default_prompt: "Use $quote-card-builder. If information is missing, ask exactly for: 1. quote; 2. visible attribution or none; 3. neutral or custom palette; 4. Editorial, Poster, or Frame direction. Do not ask for tone and do not generate files directly in chat. Once all four answers are known, call quote_card_builder_open_editor once and leave production and download to the editor."
policy:
  allow_implicit_invocation: true
